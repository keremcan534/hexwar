<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1b2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HexWar</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <canvas id="map"></canvas>

  <!-- HOI4 düzeni: sol üstte bayrak, sağa doğru kaynak şeridi, sağda tur denetimi -->
  <header class="topbar">
    <button class="nation-badge" id="nation-badge" title="Ülke özeti">
      <img class="flag" id="top-flag" alt="" />
      <span class="nation-text">
        <b id="top-nation">—</b>
        <small id="top-sub">—</small>
      </span>
    </button>

    <div class="res-strip" id="resources">—</div>
    <button class="icon-btn" id="btn-settings" aria-label="Ayarlar">☰</button>
  </header>

  <!-- Tur denetimi sol altta: harita modlarının karşısı. Üst çubuk bilgi için
       kalsın; 375 pikselde hepsi tek satıra sığmıyordu. -->
  <div class="turn-control" id="turn-control">
    <span class="turn-badge">TUR <b id="turn-value">1</b></span>
    <button class="action compact" id="btn-next-unit">Sıradaki</button>
    <button class="primary compact" id="btn-end-turn">Turu Bitir</button>
  </div>

  <!-- Sağ altta harita modları, Paradox oyunlarındaki gibi -->
  <div class="map-modes" id="map-modes">
    <button class="mode-btn active" data-mode="political" title="Politik harita">◧</button>
    <button class="mode-btn" data-mode="terrain" title="Arazi haritası">▲</button>
    <button class="mode-btn" data-mode="cultures" title="Kültür haritası">☯</button>
    <button class="mode-btn" id="btn-layers" title="Katmanlar">◈</button>
  </div>

  <div class="layer-menu hidden" id="layer-menu">
    <label><input type="checkbox" id="opt-grid" checked /> Izgara</label>
    <label><input type="checkbox" id="opt-labels" checked /> Etiketler</label>
    <button class="chip" id="seed-chip" title="Tohumu kopyala">
      <span class="chip-label">seed</span><span id="seed-value">—</span>
    </button>
  </div>

  <div class="panel hidden" id="settings">
    <div class="panel-head">
      <h2>Dünya Ayarları</h2>
      <button class="icon-btn" id="btn-close-settings" aria-label="Kapat">✕</button>
    </div>
    <label class="field">
      <span>Tohum (seed)</span>
      <input type="text" id="in-seed" placeholder="boş bırak = rastgele" autocomplete="off" />
    </label>
    <label class="field">
      <span>Harita boyutu: <b id="lbl-size">78 × 62</b></span>
      <input type="range" id="in-size" min="30" max="130" step="2" value="78" />
    </label>
    <label class="field">
      <span>Kıtasallık: <b id="lbl-cont">0.50</b></span>
      <input type="range" id="in-cont" min="0" max="1" step="0.05" value="0.5" />
    </label>
    <label class="field">
      <span>Kara oranı: <b id="lbl-land">0.00</b></span>
      <input type="range" id="in-land" min="-0.5" max="0.5" step="0.05" value="0" />
    </label>
    <label class="field">
      <span>Ülke sayısı: <b id="lbl-nations">otomatik</b></span>
      <input type="range" id="in-nations" min="0" max="30" step="1" value="0" />
    </label>
    <button class="primary" id="btn-generate">Yeni Dünya Üret</button>
    <div class="action-row" style="margin-top:14px">
      <div class="k">kayıt</div>
      <button class="action" id="btn-save">Kaydet</button>
      <button class="action" id="btn-load">Yükle</button>
    </div>
    <p class="hint" id="save-info"></p>
    <p class="hint" id="gen-stats"></p>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div class="hegemony" id="hegemony"></div>
    <div class="sheet-body" id="sheet-body">
      <p class="placeholder">Bilgi için bir hex'e dokun.</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
