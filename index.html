<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1b2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HexWar</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <canvas id="map"></canvas>

  <header class="topbar">
    <div class="brand">HEX<span>WAR</span></div>
    <button class="chip" id="seed-chip" title="Tohumu kopyala">
      <span class="chip-label">seed</span><span id="seed-value">—</span>
    </button>
    <div class="spacer"></div>
    <button class="icon-btn" id="btn-layers" aria-label="Katmanlar">◈</button>
    <button class="icon-btn" id="btn-settings" aria-label="Ayarlar">☰</button>
  </header>

  <div class="layer-menu hidden" id="layer-menu">
    <label><input type="checkbox" id="opt-owners" checked /> Ülkeler</label>
    <label><input type="checkbox" id="opt-grid" checked /> Izgara</label>
    <label><input type="checkbox" id="opt-labels" checked /> Etiketler</label>
  </div>

  <div class="panel hidden" id="settings">
    <div class="panel-head">
      <h2>Dünya Ayarları</h2>
      <button class="icon-btn" id="btn-close-settings" aria-label="Kapat">✕</button>
    </div>
    <label class="field">
      <span>Tohum (seed)</span>
      <input type="text" id="in-seed" placeholder="boş bırak = rastgele" autocomplete="off" />
    </label>
    <label class="field">
      <span>Harita boyutu: <b id="lbl-size">78 × 62</b></span>
      <input type="range" id="in-size" min="30" max="130" step="2" value="78" />
    </label>
    <label class="field">
      <span>Kıtasallık: <b id="lbl-cont">0.50</b></span>
      <input type="range" id="in-cont" min="0" max="1" step="0.05" value="0.5" />
    </label>
    <label class="field">
      <span>Kara oranı: <b id="lbl-land">0.00</b></span>
      <input type="range" id="in-land" min="-0.5" max="0.5" step="0.05" value="0" />
    </label>
    <label class="field">
      <span>Ülke sayısı: <b id="lbl-nations">otomatik</b></span>
      <input type="range" id="in-nations" min="0" max="30" step="1" value="0" />
    </label>
    <button class="primary" id="btn-generate">Yeni Dünya Üret</button>
    <p class="hint" id="gen-stats"></p>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div class="turn-bar">
      <div class="turn-info">
        <span class="turn-no">Tur <b id="turn-value">1</b> · <b id="gold-value">0</b> altın <span id="income-value"></span></span>
        <span class="turn-nation" id="turn-nation">—</span>
      </div>
      <button class="action compact" id="btn-next-unit">Sıradaki</button>
      <button class="primary compact" id="btn-end-turn">Turu Bitir</button>
    </div>
    <div class="sheet-body" id="sheet-body">
      <p class="placeholder">Bilgi için bir hex'e dokun.</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
