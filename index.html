<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#071019" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HexWar</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <canvas id="map"></canvas>

  <!-- HOI4 düzeni: sol üstte bayrak, sağa doğru kaynak şeridi, sağda tur denetimi -->
  <header class="topbar">
    <button class="nation-badge" id="nation-badge" title="Nation overview">
      <span class="flag-frame">
        <img class="flag" id="top-flag" alt="" />
        <i aria-hidden="true"></i>
      </span>
      <span class="nation-text">
        <b id="top-nation">—</b>
        <small id="top-sub">—</small>
      </span>
    </button>

    <div class="res-strip" id="resources" aria-label="National resources">—</div>
    <div class="macro-strip" id="macro-stats" aria-label="National statistics">—</div>
    <button class="icon-btn" id="btn-settings" aria-label="Settings">☰</button>
  </header>

  <!-- Gerçek zaman denetimi: simülasyon haftalık adımlarla arka planda akar. -->
  <div class="turn-control" id="turn-control">
    <span class="turn-badge"><b id="turn-value">1 JAN 1836</b></span>
    <button class="time-btn active" id="btn-pause" data-speed="0" aria-label="Pause">Ⅱ</button>
    <button class="time-btn" data-speed="1">▶</button>
    <button class="time-btn" data-speed="2">▶▶</button>
    <button class="time-btn" data-speed="4">▶▶▶</button>
  </div>

  <!-- HOI4'ün sekme düğmeleri: her biri tam ekran bir yönetim ekranı açar -->
  <!-- Cephe mekaniği üzerinde çalışırken yalnız Production açık. Diğer ekranların
       kodu duruyor; hidden sınıfı kaldırılınca geri gelirler. -->
  <nav class="tab-bar" id="tab-bar" aria-label="National management">
    <button data-screen="construction" class="hidden"><span>🏗</span>Construction</button>
    <button data-screen="industry" class="hidden"><span>🏭</span>Industry</button>
    <button data-screen="production"><span>⚒</span>Production</button>
    <button data-screen="budget" class="hidden"><span>¤</span>Budget</button>
    <button data-screen="research" class="hidden"><span>🔬</span>Research</button>
    <button data-screen="logistics" class="hidden"><span>📦</span>Logistics</button>
    <button data-screen="diplomacy" class="hidden"><span>🕊</span>Diplomacy</button>
    <button data-screen="trade" class="hidden"><span>⚖</span>Trade</button>
  </nav>

  <section class="screen hidden" id="screen" aria-hidden="true">
    <header class="screen-head">
      <div class="screen-heading">
        <span>STRATEGIC COMMAND</span>
        <h2 id="screen-title">—</h2>
      </div>
      <div class="screen-res" id="screen-res"></div>
      <button class="icon-btn" id="screen-close" aria-label="Close">✕</button>
    </header>
    <div class="screen-body" id="screen-body"></div>
    <i class="screen-rail" aria-hidden="true"></i>
  </section>

  <!-- Sağ altta harita modları, Paradox oyunlarındaki gibi -->
  <div class="map-modes" id="map-modes">
    <button class="mode-btn active" data-mode="political" title="Political map">◧</button>
    <button class="mode-btn" data-mode="terrain" title="Terrain map">▲</button>
    <button class="mode-btn" data-mode="cultures" title="Culture map">☯</button>
    <button class="mode-btn" data-mode="resources" title="Resource map">⛏</button>
    <button class="mode-btn" id="btn-layers" title="Map layers">◈</button>
  </div>

  <div class="layer-menu hidden" id="layer-menu">
    <label><input type="checkbox" id="opt-grid" checked /> Grid</label>
    <label><input type="checkbox" id="opt-labels" checked /> Labels</label>
    <button class="chip" id="seed-chip" title="Copy seed">
      <span class="chip-label">seed</span><span id="seed-value">—</span>
    </button>
  </div>

  <div class="panel hidden" id="settings">
    <div class="panel-head">
      <h2>World Settings</h2>
      <button class="icon-btn" id="btn-close-settings" aria-label="Close">✕</button>
    </div>
    <label class="field">
      <span>World seed</span>
      <input type="text" id="in-seed" placeholder="leave blank for random" autocomplete="off" />
    </label>
    <label class="field">
      <span>Map size: <b id="lbl-size">78 × 62</b></span>
      <input type="range" id="in-size" min="30" max="130" step="2" value="78" />
    </label>
    <label class="field">
      <span>Continentality: <b id="lbl-cont">0.50</b></span>
      <input type="range" id="in-cont" min="0" max="1" step="0.05" value="0.5" />
    </label>
    <label class="field">
      <span>Land ratio: <b id="lbl-land">0.00</b></span>
      <input type="range" id="in-land" min="-0.5" max="0.5" step="0.05" value="0" />
    </label>
    <label class="field">
      <span>Nation count: <b id="lbl-nations">automatic</b></span>
      <input type="range" id="in-nations" min="0" max="30" step="1" value="0" />
    </label>
    <button class="primary" id="btn-generate">Generate New World</button>
    <div class="action-row" style="margin-top:14px">
      <div class="k">save game</div>
      <button class="action" id="btn-save">Save</button>
      <button class="action" id="btn-load">Load</button>
    </div>
    <p class="hint" id="save-info"></p>
    <p class="hint" id="gen-stats"></p>
  </div>

  <!-- Solda seçili tümen listesi (HOI4'ün seçim paneli) -->
  <aside class="divisions hidden" id="divisions" aria-label="Selected divisions">
    <div class="divisions-head">
      <b id="divisions-count">—</b>
      <button class="icon-btn" id="divisions-clear" aria-label="Clear selection">✕</button>
    </div>
    <div class="divisions-body" id="divisions-body"></div>
  </aside>

  <!-- Ekranın orta altında sabit komuta paneli: üstte plan araçları,
       altta general portreleri. HOI4'teki komutan çubuğunun karşılığı. -->
  <div class="command-dock" id="command-dock" aria-label="Army command">
    <div class="command-tools hidden" id="command-tools">
      <button class="tool-btn" data-tool="front" title="Draw a front line">⌇ Front</button>
      <button class="tool-btn" data-tool="fallback" title="Draw a fallback line">⌐ Fallback</button>
      <button class="tool-btn" id="btn-offensive" title="Toggle the offensive: divisions advance along the front">➤ Offensive</button>
      <span class="tool-sep"></span>
      <span class="tool-label">Stance</span>
      <button class="tool-btn stance" data-stance="1" title="Careful">1</button>
      <button class="tool-btn stance" data-stance="2" title="Balanced">2</button>
      <button class="tool-btn stance" data-stance="3" title="Aggressive">3</button>
    </div>
    <div class="command-bar" id="command-bar" aria-label="Commanders"></div>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div class="hegemony" id="hegemony"></div>
    <div class="sheet-body" id="sheet-body">
      <p class="placeholder">Select a province to develop it, or an army to issue movement orders.</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
